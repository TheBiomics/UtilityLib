[build-system]
  requires = ["setuptools>=68.0"]
  build-backend = "setuptools.build_meta"

[project]
  name = "UtilityLib"
  description = "Unified Python utility library"
  version = "2.21.5"
  authors = [
    { name="Vishal Kumar Sahu", email="mail@vishalkumarsahu.in" }
  ]
  readme = "README.md"
  license = {file = "LICENSE"}
  requires-python = ">=3.10"
  classifiers = [
    'Operating System :: OS Independent',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Utilities',
  ]
  dependencies = [
    'pyyaml',
  ]

[project.optional-dependencies]
  all = [
    'pandas',
    'tqdm',
    'requests',
    'toml',
    'xmltodict',
    'sqlalchemy',
    'psutil',
    'seaborn',
    'openpyxl',
    'schedule',
    'humanize',
    'cryptography',
    'selenium>=4.10.0',
    'seleniumwire',
    'mechanicalsoup',
    'blinker>=1.7.0',
  ]
  data   = ['pandas', 'tqdm', 'openpyxl', 'seaborn']
  web    = ['requests', 'selenium>=4.10.0', 'seleniumwire', 'mechanicalsoup']
  crypto = ['cryptography']
  db     = ['sqlalchemy', 'psutil']
  dev    = ['pandas', 'requests', 'pyyaml', 'toml', 'schedule', 'psutil']

[project.scripts]
  pm2s = "UtilityLib.cli.pm2:main"
  ul = "UtilityLib.cli.ul:main"

[tool.setuptools.packages.find]
  include = ["UtilityLib*"]

[project.urls]
  Homepage = "https://github.com/TheBiomics/UtilityLib"
  Issues = "https://github.com/TheBiomics/UtilityLib/issues"
